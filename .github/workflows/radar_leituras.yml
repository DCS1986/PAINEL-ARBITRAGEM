name: Radar - leituras para a planilha

on:
  schedule:
    - cron: "*/30 13-20 * * 1-5"  # a cada 30 min durante o pregão (10h00 às 17h30 de Brasília)
    - cron: "30 21 * * 1-5"       # 18h30 de Brasília, depois do fechamento
    - cron: "0 11 * * 1-5"        # 08h00 de Brasília, antes da abertura
  workflow_dispatch:           # botão "Run workflow" para rodar à mão

permissions:
  contents: write

jobs:
  leituras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r radar_tecnico/radar/requirements.txt
      - name: Gerar leituras
        run: python radar_tecnico/radar/gerar_leituras.py
      - name: Salvar no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar_tecnico/radar/leituras.csv
          git diff --staged --quiet || (git commit -m "Radar: leituras $(date +%Y-%m-%d)" && git push)
